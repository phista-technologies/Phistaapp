name: phista
description: A new Flutter project.

publish_to: "none"

version: 1.0.1+14

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  clipboard: ^0.1.3
  cloud_firestore: ^5.6.2
  country_code_picker: ^3.2.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  date_picker_timeline: ^1.2.6
  dotted_border: ^2.1.0
  firebase_app_check: ^0.3.2+1
  firebase_auth: ^5.4.1
  firebase_database: ^11.3.7
  firebase_storage: ^12.4.1

  flutter_easyloading: ^3.0.5
  flutter_html: any
  flutter_local_notifications: ^18.0.1
  flutter_paypal: ^0.2.1
  flutter_polyline_points: ^2.1.0
  flutter_rating_bar: ^4.0.1
  flutter_stripe: ^11.5.0
  flutter_svg: ^2.0.17
  geocoding: ^3.0.0
  geolocator: any
  get: ^4.6.6
  google_maps_flutter: ^2.10.0
  google_maps_place_picker_mb: ^3.1.2
  google_sign_in: ^6.2.2
  googleapis_auth: ^1.6.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  location: ^8.0.0
  map_launcher: ^3.5.0
  osm_nominatim: ^3.0.1
  pin_code_fields: ^8.0.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.3.7
  share_plus: ^10.1.4
  shared_preferences: ^2.5.1
  sign_in_with_apple: ^6.1.4
  syncfusion_flutter_datepicker: ^28.2.4
  timer_count_down: ^2.2.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  firebase_remote_config: ^5.4.7
  intl_phone_field: ^3.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  flutter_osm_plugin: ^1.4.2
  flutter_email_sender: ^6.0.2
  qr_code_dart_scan: ^0.11.4


dependency_overrides:
  webview_flutter: ^4.8.0
  http: ^1.3.0
  firebase_messaging: ^15.2.1
  firebase_core: ^3.10.1
  google_api_headers: 3.7.0
  package_info_plus: ^8.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: GolosText-Regular
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf

    - family: GolosText-Medium
      fonts:
        - asset: assets/fonts/GolosText-Medium.ttf

    - family: GolosText-Black
      fonts:
        - asset: assets/fonts/GolosText-Black.ttf

    - family: GolosText-Bold
      fonts:
        - asset: assets/fonts/GolosText-Bold.ttf

    - family: GolosText-ExtraBold
      fonts:
        - asset: assets/fonts/GolosText-ExtraBold.ttf

    - family: GolosText-SemiBold
      fonts:
        - asset: assets/fonts/GolosText-SemiBold.ttf
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icon/
    - assets/json/
    - assets/fonts/
